name: Unpack tarball to deploy branch
on:
  push:
    branches: [main]
    paths: ['*.tar.gz']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          f=$(git log --format= --name-only --diff-filter=AM -- '*.tar.gz' | grep -m1 'tar.gz$')
          echo "Using $f"
          mkdir /tmp/u && tar xzf "$f" -C /tmp/u --no-same-owner
          cd /tmp/u/brandcanvas && test -f package.json
          git init -q -b deploy && git add -A
          git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm "$f"
          git push -f https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} deploy
